name: guruvandan_flutter
description: A spiritual routine tracker for satsang, meditation, Sadguru quotes, and admin-managed devotional content.
publish_to: "none"
version: 1.0.42+46

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  audio_session: ^0.2.4
  cupertino_icons: ^1.0.8
  firebase_auth: ^5.3.4
  firebase_core: ^3.9.0
  firebase_database: ^11.2.0
  google_fonts: ^6.2.1
  intl: ^0.20.1
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  shared_preferences: ^2.3.4
  share_plus: ^13.3.0
  http: ^1.6.0
  google_sign_in: ^7.2.0
  app_links: ^7.0.0
  cross_file: ^0.3.5+4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_icon.png
    - assets/images/chakra_logo.png
    - assets/images/guru_image.jpeg
    - assets/audio/meditation_chant.mp3
    - assets/audio/om_mantra_417hz_loop.mp3
    - assets/audio/morning_satsang_astuti_rishikesh.mp3
    - assets/audio/shaam_satsang_full.mp3
    - assets/audio/shaam_aarti.mp3
