<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms demo</title>
</head>

<body>
    <h1>Forms Demo</h1>
    <button>This button does not submits because it is outside of the form</button>
    <hr>
    <form action="/jg">

        <p>
            <label for="username">Enter username:</label>
            <input type="text" placeholder="Enter username" id="username" name="username">
        </p>
        <button type="submit">This button will submit</button>
        <p>
            <label for="Password">Enter Password:</label>
            <input type="password" placeholder="Enter password" id="Password" name="password">
        </p>
        <p>
            <label for="color">Select color:</label>
            <input type="color" id="color" name="color">
        </p>
        <button type="button">This button does not submit
        </button>
        <p>
            <label for="Number">Enter Number:</label>
            <input type="number" placeholder="Enter number" id="Number" name="number">
        </p>
        <button>Submit</button>
    </form>
    <hr>
    <div>
        <h1>Creating a Reddedit , Google and Youtube search <form action=""></form>
        </h1>
        <hr>
        <form action="https://www.reddit.com/search">
            <label for="reddedit">This is to search into reddedit:</label>
            <input type="text " name="q" id="reddedit">
            <button type="submit">Search rededit</button>
        </form>
        <hr>
        <form action="https://www.google.com/search">
            <label for="google">This is to search in google:</label>
            <input type="text" name="q" id="google">
            <button type="submit">Search google</button>
        </form>
        <hr>
        <form action="https://www.youtube.com/results">
            <label for="Youtube">This is to search in Youtube:</label>
            <input type="text" name="search_query" id="Youtube">
            <button type="submit">Youtube Search</button>
        </form>
    </div>
    <hr>
    <div>
        <h1>Creating a checkbox</h1>
        <form action="jg">
            <label for="agree">I agree with everything</label>
            <input type="checkbox" id="agree" name="agree">
            <button type="Submit">Submit</button>
        </form>
    </div>
    <hr>
    <div>
        <h1>Creating Radiobuttons</h1>
        <form action="jg">
            <label for="xs">XS</label>
            <input type="radio" name="size" id="xs" value="Extra small">
            <label for="s">S</label>
            <input type="radio" name="size" id="s" value="Small">
            <label for="l">L</label>
            <input type="radio" name="size" id="l" value="Large">
            <button type="submit">submit</button>
        </form>
        <hr>
    </div>
    <div>
        <form action="jg">
            <h1>Creating a drop down menu</h1>
            <label for="state">Please select a state</label>
            <select name="state" id="state">
                <option value="Delhi" selected>Delhi</option>
                <option value="Uttar Pradesh">Uttar Pradesh</option>
                <option value="uttrakhand">uttrakhand</option>
                <option value="Himachal Pradesh">Himachal Pradesh</option>
            </select>
            <button type="submit">Submit</button>
        </form>
    </div>
    <hr>

    <h1>Creating Range slider</h1>
    <Div>
        <form>
            <label for="volume">Adjust Volume:</label>
            <input type="range" id="volume" min="0" max="40" name="Volume" value="10" step="5">
            <button type="submit">Submit</button>
        </form>
    </Div>
    <hr>
    <div>
        <h1>Creating a text area</h1>
        <form action="jg">
            <label for="request">Type your request</label>
            <textarea id="request" name="request" rows="10" cols="20" placeholder="enter something area"></textarea>
            <button type="submit">submit</button>

        </form>
    </div>
    <hr>
    <div>
        <h1>Forms validation demo</h1>
        <form action="jg">
            <label for="first">Enter first Name:</label>
            <input type="text" name="first" id="first" required>
            <p>
                <label for="username">Enter your Username:</label>
                <input type="text" name="username" id="username" minlength="5" maxlength="20">
            </p>
            <p>
                <label for="email">Enter your email:</label>
                <input type="email" name="email" id="email" required>
            </p>
            <p>
                <label for="url">Enter the URL:</label>
                <input type="url" name="url" id="url" required>
            </p>
            <button type="submit">Submit</button>

        </form>
    </div>
</body>

</html>
